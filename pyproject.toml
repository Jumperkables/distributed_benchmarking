[build-system]
requires = [
  "setuptools>=64",
  "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "distributed_benchmarking"
version = "0.0.0"
description = "Benchmarking concepts of distributed computing in modern machine learning (2026)"
readme = "README.md"
requires-python = "==3.14.6"

authors = [{ name = "Jumperkables"}]

# Requirements.txt style dependencies
dependencies = [
    "datasets==5.0.1",
    "tensorboard==2.21.0",
    "torch-tb-profiler",
    "torch==2.13.0",
    "torchvision==0.28.0",
    "transformers==5.16.1",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]


[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]